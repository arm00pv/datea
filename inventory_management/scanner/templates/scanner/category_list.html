{% extends 'base.html' %}

{% block title %}Manage Categories{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Manage Categories</h1>
        <a href="{% url 'add_category' %}" class="btn btn-primary">Add New Category</a>
    </div>
    <ul class="list-group">
        {% for category in categories %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ category.name }}
                <div>
                    <a href="{% url 'edit_category' category.pk %}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'delete_category' category.pk %}" class="btn btn-sm btn-danger">Delete</a>
                </div>
            </li>
        {% empty %}
            <li class="list-group-item text-center">No categories found.</li>
        {% endfor %}
    </ul>
{% endblock %}
