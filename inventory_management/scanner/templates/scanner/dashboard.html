{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}
    <h1>Dashboard</h1>
    <div class="row">
        <div class="col-md-4">
            <a href="{% url 'item_list' %}" class="text-decoration-none">
                <div class="card text-white bg-primary mb-3">
                    <div class="card-header">Total Items</div>
                    <div class="card-body">
                        <h5 class="card-title">{{ total_items }}</h5>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a href="{% url 'expiring_soon_list' %}" class="text-decoration-none">
                <div class="card text-white bg-warning mb-3">
                    <div class="card-header">Expiring Soon</div>
                    <div class="card-body">
                        <h5 class="card-title">{{ expiring_soon_count }}</h5>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a href="{% url 'low_stock_list' %}" class="text-decoration-none">
                <div class="card text-white bg-danger mb-3">
                    <div class="card-header">Low Stock</div>
                    <div class="card-body">
                        <h5 class="card-title">{{ low_stock_count }}</h5>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Items by Category</div>
                <div class="card-body">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Top 5 Most Stocked Items</div>
                <div class="card-body">
                    <canvas id="stockChart"></canvas>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('{% url "chart_data" %}')
            .then(response => response.json())
            .then(data => {
                const categoryCtx = document.getElementById('categoryChart').getContext('2d');
                new Chart(categoryCtx, {
                    type: 'pie',
                    data: {
                        labels: data.category_chart.labels,
                        datasets: [{
                            label: 'Items by Category',
                            data: data.category_chart.data,
                            backgroundColor: [
                                'rgba(255, 99, 132, 0.2)',
                                'rgba(54, 162, 235, 0.2)',
                                'rgba(255, 206, 86, 0.2)',
                                'rgba(75, 192, 192, 0.2)',
                                'rgba(153, 102, 255, 0.2)',
                                'rgba(255, 159, 64, 0.2)'
                            ],
                            borderColor: [
                                'rgba(255, 99, 132, 1)',
                                'rgba(54, 162, 235, 1)',
                                'rgba(255, 206, 86, 1)',
                                'rgba(75, 192, 192, 1)',
                                'rgba(153, 102, 255, 1)',
                                'rgba(255, 159, 64, 1)'
                            ],
                            borderWidth: 1
                        }]
                    },
                });

                const stockCtx = document.getElementById('stockChart').getContext('2d');
                new Chart(stockCtx, {
                    type: 'bar',
                    data: {
                        labels: data.stock_chart.labels,
                        datasets: [{
                            label: 'Total Quantity',
                            data: data.stock_chart.data,
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            });
    });
</script>
{% endblock %}
