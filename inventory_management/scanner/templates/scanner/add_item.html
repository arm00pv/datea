{% extends 'base.html' %}

{% block title %}Add Item{% endblock %}

{% block content %}
    <h1>Add New Item</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="button" id="scan-upc-button">Scan UPC</button>
        <button type="submit">Save</button>
    </form>

    <div>
        <video id="video" width="300" height="200" style="border: 1px solid gray"></video>
    </div>
    <p id="result"></p>

    <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
    <script>
        window.addEventListener('load', function () {
            const codeReader = new ZXingBrowser.BrowserMultiFormatReader();
            const scanButton = document.getElementById('scan-upc-button');
            const videoElement = document.getElementById('video');
            const resultElement = document.getElementById('result');
            const itemNumberInput = document.getElementById('id_item_number');
            let selectedDeviceId;

            // List available video devices
            codeReader.listVideoInputDevices()
                .then((videoInputDevices) => {
                    if (videoInputDevices.length > 0) {
                        // Use the first device by default
                        selectedDeviceId = videoInputDevices[0].deviceId;
                    }
                })
                .catch((err) => {
                    console.error(err);
                    resultElement.textContent = "Could not list video devices.";
                });

            scanButton.addEventListener('click', () => {
                if (!selectedDeviceId) {
                    resultElement.textContent = "No video device found.";
                    return;
                }

                resultElement.textContent = "Starting scanner...";

                codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
                    if (result) {
                        console.log(result);
                        resultElement.textContent = `Found barcode: ${result.text}`;
                        itemNumberInput.value = result.text;
                        codeReader.reset();
                        resultElement.textContent = "Scanner stopped.";
                    }
                    if (err && !(err instanceof ZXingBrowser.NotFoundException)) {
                        console.error(err);
                        resultElement.textContent = `Error: ${err}`;
                    }
                });
            });
        });
    </script>
{% endblock %}
