{% extends 'base.html' %}

{% block title %}Add Item{% endblock %}

{% block content %}
    <h1>Add New Item</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.item_number.label_tag }}
            <input type="text" name="item_number" id="id_item_number" class="form-control" required>
        </div>
        <div class="mb-3">
            {{ form.name.label_tag }}
            <input type="text" name="name" id="id_name" class="form-control" required>
        </div>
        <div class="mb-3">
            {{ form.quantity.label_tag }}
            <input type="number" name="quantity" id="id_quantity" class="form-control" required>
        </div>
        <div class="mb-3">
            {{ form.expiration_date.label_tag }}
            <input type="date" name="expiration_date" id="id_expiration_date" class="form-control" required>
        </div>
        <button type="button" id="scan-upc-button" class="btn btn-secondary">Scan UPC</button>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
    <script>
        document.getElementById('scan-upc-button').addEventListener('click', function() {
            var upc = prompt("Enter UPC code");
            if (upc) {
                document.getElementById('id_item_number').value = upc;
            }
        });
    </script>
{% endblock %}
