<!DOCTYPE html>
<html>
<head>
    <title>Item List</title>
</head>
<body>
    <h1>Item List</h1>
    <a href="{% url 'add_item' %}">Add New Item</a>
    <br/><br/>
    <table border="1">
        <thead>
            <tr>
                <th>Item Number</th>
                <th>Name</th>
                <th>Quantity</th>
                <th>Entry Date</th>
                <th>Expiration Date</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.item_number }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.quantity }}</td>
                <td>{{ item.entry_date }}</td>
                <td>{{ item.expiration_date }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
