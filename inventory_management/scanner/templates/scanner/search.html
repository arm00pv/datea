{% extends 'base.html' %}

{% block title %}Search{% endblock %}

{% block content %}
    <h1>Search</h1>

    <form method="get" action="{% url 'search_results' %}">
        <div class="input-group mb-3">
            <input type="text" class="form-control" name="q" placeholder="Search by item number or name">
            <button class="btn btn-primary" type="submit">Search</button>
        </div>
    </form>

    <hr>

    <h3>Or Scan UPC</h3>
    <button type="button" id="scan-upc-button" class="btn btn-secondary">Scan UPC</button>
    <div>
        <video id="video" width="300" height="200" style="border: 1px solid gray; display: none;"></video>
    </div>
    <p id="result"></p>

    <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
    <script>
        window.addEventListener('load', function () {
            const resultElement = document.getElementById('result');
            const videoElement = document.getElementById('video');

            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                resultElement.innerHTML = "<strong>Error:</strong> Camera access requires a secure connection (HTTPS).";
                return;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                resultElement.innerHTML = "<strong>Error:</strong> Camera access is not supported by your browser.";
                return;
            }

            const codeReader = new ZXingBrowser.BrowserMultiFormatReader();
            const scanButton = document.getElementById('scan-upc-button');
            let selectedDeviceId;

            codeReader.listVideoInputDevices()
                .then((videoInputDevices) => {
                    if (videoInputDevices.length > 0) {
                        selectedDeviceId = videoInputDevices[0].deviceId;
                    } else {
                        resultElement.textContent = "No camera found on this device.";
                    }
                })
                .catch((err) => {
                    console.error(err);
                    resultElement.textContent = "Could not list video devices.";
                });

            scanButton.addEventListener('click', () => {
                if (!selectedDeviceId) {
                    resultElement.textContent = "No video device found.";
                    return;
                }

                videoElement.style.display = 'block';
                resultElement.textContent = "Starting scanner...";

                codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
                    if (result) {
                        console.log(result);
                        resultElement.textContent = `Found barcode: ${result.text}`;
                        codeReader.reset();
                        videoElement.style.display = 'none';
                        // Redirect to the search results page with the scanned UPC
                        window.location.href = `{% url 'search_results' %}?q=${result.text}`;
                    }
                    if (err && !(err instanceof ZXingBrowser.NotFoundException)) {
                        console.error(err);
                        resultElement.textContent = `Error: ${err}`;
                    }
                });
            });
        });
    </script>
{% endblock %}
