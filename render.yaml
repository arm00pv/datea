services:
  - type: web
    name: inventory-management
    env: python
    buildCommand: "./build.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4

databases:
  - name: inventory-db
    databaseName: inventory_db
    user: inventory_user
